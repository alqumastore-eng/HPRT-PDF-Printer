
name: Build HPRT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q HPRT_PDF_Printer_Source.zip -d source

      - name: Build APK
        working-directory: source/HPRT_PDF_Printer
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: HPRT-PDF-Printer-APK
          path: source/HPRT_PDF_Printer/app/build/outputs/apk/debug/app-debug.apk

